<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>IT-Ausbildung Lernwerkzeuge</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Fira+Code:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body class="text-slate-200 min-h-screen flex flex-col justify-between">

    <!-- Background Decorative Elements -->
    <canvas id="matrix-bg" class="fixed inset-0 z-0 pointer-events-none"></canvas>
    <div class="absolute top-0 left-1/2 -translate-x-1/2 w-full max-w-7xl h-96 bg-gradient-to-b from-slate-400/10 via-transparent to-transparent blur-3xl pointer-events-none"></div>

    <!-- Main Content Container -->
    <div class="container mx-auto px-4 py-16 max-w-6xl relative z-10 flex-grow flex flex-col justify-start">

        <!-- Header -->
        <div class="text-center mb-12">
            <div class="inline-flex items-center gap-2 px-3 py-1 rounded-full bg-slate-400/10 border border-slate-400/20 text-slate-400 text-xs font-medium uppercase tracking-wider mb-4">
                <span class="w-2 h-2 rounded-full bg-slate-300 animate-pulse"></span>
                <span class="font-mono">IT-Ausbildung Workspace</span>
            </div>
            <h1 class="text-4xl md:text-5xl font-extrabold tracking-tight bg-clip-text text-transparent bg-gradient-to-r from-white via-slate-200 to-slate-400">
                IT-Ausbildung Lernwerkzeuge
            </h1>
            <p class="mt-4 text-base md:text-lg text-slate-400 max-w-xl mx-auto">
                Lernwerkzeuge für PUG (Politik und Gesellschaft)
            </p>
        </div>

        <!-- Back Button -->
        <div class="mb-8">
            <a href="index.html" class="inline-flex items-center gap-2 text-slate-400 hover:text-white transition-colors">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M10 19l-7-7m0 0l7-7m-7 7h18"></path>
                </svg>
                Zurück zum Hauptmenü
            </a>
        </div>

        <!-- Subject Section -->
        <section class="mb-16">
            <h2 class="text-3xl font-bold text-white mb-8 border-b border-slate-700 pb-3 font-mono">PUG (Politik und Gesellschaft)</h2>
            <div class="grid md:grid-cols-2 lg:grid-cols-4 gap-6 items-stretch">

            <!-- Empty State Card -->
            <div class="glass-card rounded-2xl p-6 flex flex-col justify-center items-center text-center group h-full min-h-[250px]">
                <div class="w-12 h-12 rounded-xl bg-slate-400/10 border border-slate-400/20 flex items-center justify-center text-slate-400 text-xl font-bold mb-4 opacity-50">
                    <svg class="w-8 h-8" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M12 6v6h4.5m4.5 0a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                </div>
                <h3 class="text-lg font-semibold text-slate-300 mb-2">In Planung</h3>
                <p class="text-slate-500 text-sm leading-relaxed">
                    Noch keine Lernwerkzeuge in diesem Fach verfügbar.
                </p>
            </div>

            </div>
        </section>



    </div>

    <!-- Footer -->
    <footer class="w-full text-center py-6 border-t border-slate-900 text-xs text-slate-600 mono relative z-10 bg-black/20 backdrop-blur-sm mt-auto">
        &copy; 2026 kplueschke All rights reserved.
    </footer>

    <script src="matrix.js"></script>
</body>
</html>

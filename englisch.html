<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IT-Ausbildung Lernwerkzeuge</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Fira+Code:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body class="text-slate-200 min-h-screen flex flex-col justify-between">

    <!-- Background Decorative Elements -->
    <canvas id="matrix-bg" class="fixed inset-0 z-0 pointer-events-none"></canvas>
    <div class="absolute top-0 left-1/2 -translate-x-1/2 w-full max-w-7xl h-96 bg-gradient-to-b from-yellow-500/10 via-transparent to-transparent blur-3xl pointer-events-none"></div>

    <!-- Main Content Container -->
    <div class="container mx-auto px-4 py-16 max-w-6xl relative z-10 flex-grow flex flex-col justify-start">

        <!-- Header -->
        <div class="text-center mb-12">
            <div class="inline-flex items-center gap-2 px-3 py-1 rounded-full bg-yellow-500/10 border border-yellow-500/20 text-yellow-400 text-xs font-medium uppercase tracking-wider mb-4">
                <span class="w-2 h-2 rounded-full bg-yellow-400 animate-pulse"></span>
                <span class="font-mono">IT-Ausbildung Workspace</span>
            </div>
            <h1 class="text-4xl md:text-5xl font-extrabold tracking-tight bg-clip-text text-transparent bg-gradient-to-r from-white via-slate-200 to-slate-400">
                IT-Ausbildung Lernwerkzeuge
            </h1>
            <p class="mt-4 text-base md:text-lg text-slate-400 max-w-xl mx-auto">
                Lernwerkzeuge für Englisch
            </p>
        </div>

        <!-- Back Button -->
        <div class="mb-8">
            <a href="index.html" class="inline-flex items-center gap-2 text-slate-400 hover:text-white transition-colors">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M10 19l-7-7m0 0l7-7m-7 7h18"></path>
                </svg>
                Zurück zum Hauptmenü
            </a>
        </div>

        <!-- Subject Section -->
        <section class="mb-16">
            <h2 class="text-3xl font-bold text-white mb-8 border-b border-slate-700 pb-3 font-mono">Englisch</h2>
            <div class="grid md:grid-cols-2 lg:grid-cols-4 gap-6 items-stretch">

            <!-- Card 1: Vokabeltrainer -->
            <div class="glass-card glass-card-hover-yellow rounded-2xl p-6 flex flex-col justify-between group">
                <div>
                    <div class="w-12 h-12 rounded-xl bg-yellow-500/10 border border-yellow-500/20 flex items-center justify-center text-yellow-400 text-xl font-bold mb-6 group-hover:scale-110 transition-transform">
                        <svg class="w-8 h-8" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M10.5 21l5.25-11.25L21 21m-9-3h7.5M3 5.621a48.474 48.474 0 016-.371m0 0c1.12 0 2.233.038 3.334.114M9 5.25V3m3.334 2.364C11.176 10.658 7.69 15.08 3 17.502m9.334-12.138c.896.061 1.785.147 2.666.257m-4.589 8.495a18.023 18.023 0 01-3.827-5.802"></path></svg>
                    </div>
                    <h2 class="text-xl font-bold text-white mb-2">Vokabeltrainer</h2>
                    <p class="text-slate-400 text-sm leading-relaxed mb-6">
                        Übe deine Englisch-Vokabeln für die IT-Ausbildung. Übersetze die Begriffe und teste dein Wissen.
                    </p>
                </div>
                <a href="EnglishVocabTrainer.html" class="inline-flex items-center justify-center gap-2 w-full py-3 px-4 bg-yellow-600 hover:bg-yellow-500 active:bg-yellow-700 text-white font-medium rounded-xl transition-colors shadow-lg shadow-yellow-600/20">
                    Trainer starten
                    <svg class="w-4 h-4 transform group-hover:translate-x-1 transition-transform" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M13 5l7 7-7 7M5 5l7 7-7 7"></path>
                    </svg>
                </a>
            </div>

            </div>
        </section>



    </div>

    <!-- Footer -->
    <footer class="w-full text-center py-6 border-t border-slate-900 text-xs text-slate-600 mono relative z-10 bg-black/20 backdrop-blur-sm mt-auto">
        &copy; 2026 kplueschke All rights reserved.
    </footer>

    <script src="matrix.js"></script>
</body>
</html>

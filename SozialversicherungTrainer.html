<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Sozialversicherungs-Trainer</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Fira+Code:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body class="text-slate-200 min-h-screen flex flex-col justify-between">

    <!-- Background Decorative Elements -->
    <canvas id="matrix-bg" class="fixed inset-0 z-0 pointer-events-none"></canvas>

   <!-- Header -->
    <div class="container mx-auto px-4 py-8 relative z-10 flex-grow">
        <div class="flex items-center justify-between mb-8">
            <button onclick="window.location.href='pug.html'" class="inline-flex items-center gap-2 text-slate-400 hover:text-white transition-colors">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M10 19l-7-7m0 0l7-7m-7 7h18"></path>
                </svg>
                Zurück zur Übersicht
            </button>
        </div>
        <div class="text-center mb-12">
            <h1 class="text-3xl md:text-4xl font-extrabold tracking-tight bg-clip-text text-transparent bg-gradient-to-r from-slate-200 to-slate-400 mb-4">
                Sozialversicherungs-Trainer
            </h1>
            <p class="text-slate-400 max-w-2xl mx-auto">
                Ordne die Träger, Beitragssätze und typischen Leistungen den 5 Zweigen der Sozialversicherung zu.
            </p>
        </div>

        <div class="flex flex-col lg:flex-row gap-8 max-w-6xl mx-auto items-start relative z-10">

            <!-- SV Branches (Drop Zones) -->
            <div class="w-full lg:w-2/3 glass-card rounded-2xl p-6 flex flex-col gap-3" id="sv-branches-container">
                <h2 class="text-xl font-bold text-white mb-2 text-center">Sozialversicherungszweige</h2>
                <!-- Layers will be generated here by JS -->
            </div>

            <!-- Item Pool (Draggables) -->
            <div class="w-full lg:w-1/3 glass-card rounded-2xl p-6 sticky top-8">
                <h2 class="text-xl font-bold text-white mb-4 text-center">Begriffe</h2>
                <div class="flex flex-wrap gap-2 justify-center min-h-[300px] content-start" id="item-pool">
                    <!-- Items will be generated here by JS -->
                </div>

                <div class="mt-8 flex gap-4">
                    <button id="btn-check" class="flex-1 py-3 px-4 bg-slate-600 hover:bg-slate-500 text-white font-medium rounded-xl transition-colors shadow-lg shadow-slate-600/20">
                        Prüfen
                    </button>
                    <button id="btn-reset" class="py-3 px-4 bg-slate-800 hover:bg-slate-700 text-white font-medium rounded-xl transition-colors border border-slate-600">
                        Reset
                    </button>
                </div>
            </div>

        </div>

    </div>

    <!-- Footer -->
    <footer class="w-full text-center py-6 border-t border-slate-900 text-xs text-slate-600 mono relative z-10 bg-black/20 backdrop-blur-sm mt-8">
        &copy; 2026 kplueschke All rights reserved.
    </footer>

    <script>
        // SV Branches Data
        const svBranches = [
            { id: "kv", name: "Krankenversicherung", color: "border-slate-500/50 bg-slate-500/10" },
            { id: "rv", name: "Rentenversicherung", color: "border-slate-500/50 bg-slate-500/10" },
            { id: "av", name: "Arbeitslosenversicherung", color: "border-slate-500/50 bg-slate-500/10" },
            { id: "pv", name: "Pflegeversicherung", color: "border-slate-500/50 bg-slate-500/10" },
            { id: "uv", name: "Unfallversicherung", color: "border-slate-500/50 bg-slate-500/10" }
        ];

        // Draggable Items Data
        const draggablesData = [
            { id: "item-kv-traeger", text: "Krankenkassen (AOK, TK...)", branch: "kv" },
            { id: "item-kv-beitrag", text: "14,6% + Zusatzbeitrag", branch: "kv" },
            { id: "item-kv-leistung", text: "Krankengeld", branch: "kv" },

            { id: "item-rv-traeger", text: "Dt. Rentenversicherung", branch: "rv" },
            { id: "item-rv-beitrag", text: "18,6%", branch: "rv" },
            { id: "item-rv-leistung", text: "Altersrente", branch: "rv" },

            { id: "item-av-traeger", text: "Bundesagentur für Arbeit", branch: "av" },
            { id: "item-av-beitrag", text: "2,6%", branch: "av" },
            { id: "item-av-leistung", text: "Arbeitslosengeld I", branch: "av" },

            { id: "item-pv-traeger", text: "Pflegekassen", branch: "pv" },
            { id: "item-pv-beitrag", text: "3,4% (+ Zuschlag Kinderlose)", branch: "pv" },
            { id: "item-pv-leistung", text: "Pflegegeld", branch: "pv" },

            { id: "item-uv-traeger", text: "Berufsgenossenschaften", branch: "uv" },
            { id: "item-uv-beitrag", text: "100% Arbeitgeber", branch: "uv" },
            { id: "item-uv-leistung", text: "Verletztengeld", branch: "uv" }
        ];

        const container = document.getElementById('sv-branches-container');
        const pool = document.getElementById('item-pool');
        const checkBtn = document.getElementById('btn-check');
        const resetBtn = document.getElementById('btn-reset');

        let draggedItem = null;

        // Initialize UI
        function init() {
            // Render Branches
            container.innerHTML = '<h2 class="text-xl font-bold text-white mb-2 text-center">Sozialversicherungszweige</h2>';
            svBranches.forEach(branch => {
                const layerDiv = document.createElement('div');
                layerDiv.className = `drop-zone flex flex-col min-h-[100px] border-2 rounded-xl p-3 ${branch.color}`;
                layerDiv.dataset.branchId = branch.id;

                const label = document.createElement('div');
                label.className = 'text-base font-semibold text-slate-300 mb-2 border-b border-slate-700 pb-1';
                label.textContent = branch.name;

                const dropArea = document.createElement('div');
                dropArea.className = 'flex flex-wrap gap-2 items-center min-h-[50px] w-full';
                dropArea.dataset.dropArea = branch.id;

                layerDiv.appendChild(label);
                layerDiv.appendChild(dropArea);
                container.appendChild(layerDiv);

                // Add drop zone event listeners
                layerDiv.addEventListener('dragover', handleDragOver);
                layerDiv.addEventListener('dragenter', handleDragEnter);
                layerDiv.addEventListener('dragleave', handleDragLeave);
                layerDiv.addEventListener('drop', handleDrop);
            });

            // Add drop listener to pool
            pool.addEventListener('dragover', handleDragOver);
            pool.addEventListener('drop', handleDropToPool);

            // Render Items
            renderItems();
        }

        function renderItems() {
            pool.innerHTML = '';
            // Shuffle draggables for randomness
            const shuffled = [...draggablesData].sort(() => 0.5 - Math.random());

            shuffled.forEach(item => {
                const el = document.createElement('div');
                el.className = 'draggable-item bg-slate-800 border border-slate-600 rounded-lg px-3 py-1.5 text-sm font-medium text-slate-200 shadow-sm hover:bg-slate-700 select-none';
                el.draggable = true;
                el.id = item.id;
                el.textContent = item.text;
                el.dataset.correctBranch = item.branch;

                el.addEventListener('dragstart', handleDragStart);
                el.addEventListener('dragend', handleDragEnd);

                pool.appendChild(el);
            });
        }

        // Drag and Drop Handlers
        function handleDragStart(e) {
            draggedItem = this;
            setTimeout(() => this.classList.add('opacity-50'), 0);
            e.dataTransfer.effectAllowed = 'move';
        }

        function handleDragEnd() {
            this.classList.remove('opacity-50');
            draggedItem = null;
            document.querySelectorAll('.drop-zone').forEach(zone => zone.classList.remove('drag-over', 'border-slate-400'));
        }

        function handleDragOver(e) {
            e.preventDefault();
            e.dataTransfer.dropEffect = 'move';
            return false;
        }

        function handleDragEnter(e) {
            e.preventDefault();
            this.classList.add('drag-over', 'border-slate-400');
        }

        function handleDragLeave() {
            this.classList.remove('drag-over', 'border-slate-400');
        }

        function handleDrop(e) {
            e.stopPropagation();
            this.classList.remove('drag-over', 'border-slate-400');

            // Append to the drop area inside the layer div
            const dropArea = this.querySelector('[data-drop-area]');
            if (draggedItem && dropArea) {
                // Reset styling just in case it was checked before
                draggedItem.classList.remove('bg-emerald-600/80', 'border-emerald-400', 'bg-red-600/80', 'border-red-400', 'bg-slate-800', 'border-slate-600');
                draggedItem.classList.add('bg-slate-800', 'border-slate-600');
                dropArea.appendChild(draggedItem);
            }
            return false;
        }

        function handleDropToPool(e) {
            e.stopPropagation();
            if (draggedItem) {
                // Reset styling
                draggedItem.classList.remove('bg-emerald-600/80', 'border-emerald-400', 'bg-red-600/80', 'border-red-400', 'bg-slate-800', 'border-slate-600');
                draggedItem.classList.add('bg-slate-800', 'border-slate-600');
                pool.appendChild(draggedItem);
            }
            return false;
        }

        // Check Logic
        checkBtn.addEventListener('click', () => {
            const allItems = document.querySelectorAll('.draggable-item');
            let allCorrect = true;

            allItems.forEach(item => {
                const parentArea = item.parentElement;

                // Remove previous check styles
                item.classList.remove('bg-emerald-600/80', 'border-emerald-400', 'bg-red-600/80', 'border-red-400', 'bg-slate-800', 'border-slate-600');

                if (parentArea.id === 'item-pool') {
                    item.classList.add('bg-slate-800', 'border-slate-600');
                    allCorrect = false;
                } else {
                    const currentBranch = parentArea.dataset.dropArea;
                    const correctBranch = item.dataset.correctBranch;

                    if (currentBranch === correctBranch) {
                        item.classList.add('bg-emerald-600/80', 'border-emerald-400');
                    } else {
                        item.classList.add('bg-red-600/80', 'border-red-400');
                        allCorrect = false;
                    }
                }
            });

            if (allCorrect && document.querySelectorAll('#item-pool .draggable-item').length === 0) {
                 checkBtn.textContent = "Perfekt gelöst! 🎉";
                 checkBtn.classList.replace('bg-slate-600', 'bg-emerald-600');
                 checkBtn.classList.replace('hover:bg-slate-500', 'hover:bg-emerald-500');
                 checkBtn.classList.replace('shadow-slate-600/20', 'shadow-emerald-600/20');
                 setTimeout(() => {
                     checkBtn.textContent = "Prüfen";
                     checkBtn.classList.replace('bg-emerald-600', 'bg-slate-600');
                     checkBtn.classList.replace('hover:bg-emerald-500', 'hover:bg-slate-500');
                     checkBtn.classList.replace('shadow-emerald-600/20', 'shadow-slate-600/20');
                 }, 3000);
            }
        });

        // Reset Logic
        resetBtn.addEventListener('click', () => {
            // Move all items back to pool and reset styles
            const allItems = document.querySelectorAll('.draggable-item');
            allItems.forEach(item => {
                item.classList.remove('bg-emerald-600/80', 'border-emerald-400', 'bg-red-600/80', 'border-red-400', 'bg-slate-800', 'border-slate-600');
                item.classList.add('bg-slate-800', 'border-slate-600');
                pool.appendChild(item);
            });
            // Shuffle them again
            renderItems();
        });

        // Initialize on load
        init();
    </script>
    <script src="matrix.js"></script>
</body>
</html>

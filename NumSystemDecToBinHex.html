                Dezimal zu Binär & Hexadezimal
            </h1>
            <p class="text-slate-400 max-w-2xl mx-auto">
                Übe das Umrechnen von Dezimalzahlen in Binär- und Hexadezimalzahlen.
            </p>
        </div>



    </div>

    <main class="max-w-4xl mx-auto px-4 w-full relative z-10">
        <section class="glass-card relative rounded-2xl p-8 border border-slate-700/50 shadow-2xl mb-8">
            <div class="flex justify-between items-start mb-6">
                <h2 class="text-xl font-bold text-white flex items-center gap-2">
                    <span class="text-teal-400">📝</span> Aktuelle Aufgabe
                </h2>
                <button onclick="generateProblem()" class="px-4 py-2 bg-slate-800 hover:bg-slate-700 text-slate-300 text-sm font-medium rounded-lg border border-slate-700 transition-colors flex items-center gap-2">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path>
                    </svg>
                    Neue Aufgabe würfeln
                </button>
            </div>

            <div class="bg-slate-900/80 rounded-xl p-6 border border-slate-800 mb-6 text-center">
                <div class="text-sm font-bold text-slate-400 uppercase mb-2">Dezimal</div>
                <div id="current-problem" class="text-4xl md:text-5xl font-mono font-bold text-teal-400 tracking-widest uppercase">
                    0
                </div>
            </div>

            <div class="space-y-6">
                <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                    <div class="space-y-4">
                        <div>
                            <label class="block text-xs font-bold text-slate-400 uppercase mb-1">Binär (8-bit)</label>
                            <input type="text" id="ans-bin" placeholder="z.B. 11000000" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-3 text-slate-200 mono focus:outline-none focus:border-teal-500 focus:ring-1 focus:ring-teal-500 transition-all placeholder-slate-600">
                        </div>
                        <div>
                            <label class="block text-xs font-bold text-slate-400 uppercase mb-1">Hexadezimal</label>
                            <input type="text" id="ans-hex" placeholder="z.B. C0" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-3 text-slate-200 mono uppercase focus:outline-none focus:border-teal-500 focus:ring-1 focus:ring-teal-500 transition-all placeholder-slate-600">
                        </div>
                    </div>

                    <div class="flex flex-col justify-center space-y-4 pt-4">
                        <button onclick="checkAnswers()" class="w-full bg-teal-600 hover:bg-teal-500 text-white font-bold py-4 rounded-xl shadow-lg transition-colors shadow-teal-500/20 active:scale-95">
                            Antwort prüfen
                        </button>
                        <button onclick="toggleSolution()" class="w-full bg-slate-800 hover:bg-slate-700 text-slate-300 font-semibold py-3 rounded-xl border border-slate-700 transition-colors">
                            Lösung & Erklärung
                        </button>
                        <div id="feedback-msg" class="hidden"></div>
                    </div>
                </div>

                <div id="solution-area" class="hidden mt-8 pt-8 border-t border-slate-800">
                    <h3 class="text-xl font-bold mb-4 text-slate-200 flex items-center gap-2">
                        <span class="text-teal-400">💡</span> Schritt-für-Schritt Lösung:
                    </h3>
                    <div class="bg-slate-900/50 rounded-xl p-6 border border-slate-800">
                        <div id="solution-steps" class="space-y-4 text-slate-300"></div>
                    </div>
                </div>
            </div>
        </section>
    </main>

    <script>
        let currentDecimal = 0;
        let currentBinary = "";
        let currentHex = "";

        function generateProblem() {
            document.getElementById('solution-area').classList.add('hidden');
            document.getElementById('feedback-msg').classList.add('hidden');
            ['ans-bin', 'ans-hex'].forEach(id => {
                const el = document.getElementById(id);
                el.value = "";
                el.classList.remove('correct', 'incorrect');
            });

            // Random number between 0 and 255
            currentDecimal = Math.floor(Math.random() * 256);
            currentBinary = currentDecimal.toString(2).padStart(8, '0');
            currentHex = currentDecimal.toString(16).toUpperCase().padStart(2, '0');

            document.getElementById('current-problem').innerText = currentDecimal;
        }

        function checkAnswers() {
            const userBin = document.getElementById('ans-bin').value.trim();
            const userHex = document.getElementById('ans-hex').value.trim().toUpperCase();

            let allCorrect = true;
            const check = (id, val, sol) => {
                const el = document.getElementById(id);
                if (val === String(sol)) {
                    el.classList.add('correct');
                    el.classList.remove('incorrect');
                } else {
                    el.classList.add('incorrect');
                    el.classList.remove('correct');
                    allCorrect = false;
                }
            };

            check('ans-bin', userBin, currentBinary);
            check('ans-hex', userHex, currentHex);

            const fb = document.getElementById('feedback-msg');
            fb.classList.remove('hidden');
            if (allCorrect) {
                fb.innerText = "Hervorragend! Alles richtig berechnet. 🚀";
                fb.className = "p-4 rounded-xl text-center font-bold bg-teal-900/30 text-teal-400 border border-teal-500/50 mt-4";
            } else {
                fb.innerText = "Einige Werte stimmen noch nicht. Überprüfe deine Rechnung!";
                fb.className = "p-4 rounded-xl text-center font-bold bg-amber-900/30 text-amber-400 border border-amber-500/50 mt-4";
            }
        }

        function toggleSolution() {
            const area = document.getElementById('solution-area');
            if (!area.classList.contains('hidden')) {
                area.classList.add('hidden');
                return;
            }

            area.classList.remove('hidden');
            const steps = document.getElementById('solution-steps');

            // Generating binary steps
            let binSteps = "";
            let remaining = currentDecimal;
            const values = [128, 64, 32, 16, 8, 4, 2, 1];
            values.forEach((val, i) => {
                if(remaining >= val) {
                    binSteps += `<li>Passt ${val} in ${remaining}? <b>Ja</b>. Bit = <span class="text-teal-400 font-bold">1</span>. Rest: ${remaining} - ${val} = ${remaining - val}</li>`;
                    remaining -= val;
                } else {
                    binSteps += `<li>Passt ${val} in ${remaining}? <b>Nein</b>. Bit = <span class="text-teal-400 font-bold">0</span>. Rest bleibt ${remaining}.</li>`;
                }
            });

            // Generating hex steps
            const divStep = Math.floor(currentDecimal / 16);
            const modStep = currentDecimal % 16;
            const modHex = modStep.toString(16).toUpperCase();
            const divHex = divStep.toString(16).toUpperCase();

            steps.innerHTML = `
                <div class="bg-slate-800/50 border-l-4 border-teal-500 p-4 rounded-r-xl">
                    <p class="font-bold text-slate-200">1. Dezimal zu Binär (Subtraktionsmethode):</p>
                    <p class="text-sm mt-1 text-slate-400">Subtrahiere die größtmögliche Zweierpotenz von links nach rechts (128, 64, 32...)</p>
                    <ul class="list-disc list-inside text-sm mt-2 text-slate-300 space-y-1">
                        ${binSteps}
                    </ul>
                    <p class="text-sm mt-2 text-slate-300">Ergebnis: <span class="mono font-bold text-teal-400">${currentBinary}</span></p>
                </div>
                <div class="bg-slate-800/50 border-l-4 border-teal-500 p-4 rounded-r-xl">
                    <p class="font-bold text-slate-200">2. Dezimal zu Hexadezimal (Divisionsmethode):</p>
                    <p class="text-sm mt-1 text-slate-400">Teile durch 16 und notiere den Rest.</p>
                    <ul class="list-disc list-inside text-sm mt-2 text-slate-300 space-y-1">
                        <li>${currentDecimal} ÷ 16 = ${divStep} Rest ${modStep} &rarr; in Hex: <span class="mono font-bold text-teal-400">${modHex}</span></li>
                        <li>${divStep} ÷ 16 = 0 Rest ${divStep} &rarr; in Hex: <span class="mono font-bold text-teal-400">${divHex}</span></li>
                    </ul>
                    <p class="text-sm mt-2 text-slate-300">Von unten nach oben gelesen: <span class="mono font-bold text-teal-400">${currentHex}</span></p>
                </div>
            `;
            area.scrollIntoView({ behavior: 'smooth' });
        }

        window.onload = generateProblem;
    </script>

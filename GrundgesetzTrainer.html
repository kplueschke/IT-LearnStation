<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Grundgesetz-Trainer (Art. 1-20)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Fira+Code:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body class="text-slate-200 min-h-screen flex flex-col justify-between">

    <!-- Background Decorative Elements -->
    <canvas id="matrix-bg" class="fixed inset-0 z-0 pointer-events-none"></canvas>

    <!-- Header Controls -->
    <div class="absolute top-4 right-4 flex gap-4 z-50">
        <button id="matrix-pause-btn" class="inline-flex items-center justify-center w-10 h-10 rounded-full bg-slate-800/50 border border-slate-700/50 text-slate-400 hover:text-white hover:bg-slate-700/50 transition-colors cursor-pointer" title="Matrix-Regen pausieren/fortsetzen">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" d="M15.75 5.25v13.5m-7.5-13.5v13.5" />
            </svg>
        </button>
        <a href="einstellungen.html" class="inline-flex items-center justify-center w-10 h-10 rounded-full bg-slate-800/50 border border-slate-700/50 text-slate-400 hover:text-white hover:bg-slate-700/50 transition-colors cursor-pointer" title="Einstellungen">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" d="M9.594 3.94c.09-.542.56-.94 1.11-.94h2.593c.55 0 1.02.398 1.11.94l.213 1.281c.063.374.313.686.645.87.074.04.147.083.22.127.325.196.72.257 1.075.124l1.217-.456a1.125 1.125 0 0 1 1.37.49l1.296 2.247a1.125 1.125 0 0 1-.26 1.431l-1.003.827c-.293.241-.438.613-.43.992a7.723 7.723 0 0 1 0 .255c-.008.378.137.75.43.99l1.005.828c.424.35.534.955.26 1.43l-1.298 2.247a1.125 1.125 0 0 1-1.369.491l-1.217-.456c-.355-.133-.75-.072-1.076.124a6.47 6.47 0 0 1-.22.128c-.331.183-.581.495-.644.869l-.213 1.281c-.09.543-.56.94-1.11.94h-2.594c-.55 0-1.019-.398-1.11-.94l-.213-1.281c-.062-.374-.312-.686-.644-.87a6.52 6.52 0 0 1-.22-.127c-.325-.196-.72-.257-1.076-.124l-1.217.456a1.125 1.125 0 0 1-1.369-.49l-1.297-2.247a1.125 1.125 0 0 1 .26-1.431l1.004-.827c.292-.24.437-.613.43-.991a6.932 6.932 0 0 1 0-.255c.007-.38-.138-.751-.43-.992l-1.004-.827a1.125 1.125 0 0 1-.26-1.43l1.297-2.247a1.125 1.125 0 0 1 1.37-.491l1.216.456c.356.133.751.072 1.076-.124.072-.044.146-.086.22-.128.332-.183.582-.495.644-.869l.214-1.28Z" />
                <path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 1 1-6 0 3 3 0 0 1 6 0Z" />
            </svg>
        </a>
    </div>

    <div class="container mx-auto px-4 py-8 relative z-10 flex-grow">
        <div class="flex items-center justify-between mb-8">
            <button onclick="window.location.href='pug.html'" class="inline-flex items-center gap-2 text-slate-400 hover:text-white transition-colors">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M10 19l-7-7m0 0l7-7m-7 7h18"></path>
                </svg>
                Zurück zur Übersicht
            </button>
        </div>
        <div class="text-center mb-12">
            <h1 class="text-3xl md:text-4xl font-extrabold tracking-tight bg-clip-text text-transparent bg-gradient-to-r from-slate-200 to-white mb-4">
                Grundgesetz Lernkarten (Art. 1-20)
            </h1>
            <p class="text-slate-400 max-w-2xl mx-auto">
                Übe die wichtigsten Grundrechte und Strukturprinzipien des Grundgesetzes. Drehe die Karte um und bewerte dich selbst.
            </p>
        </div>

        <div class="max-w-2xl mx-auto relative z-10">
            <div class="glass-card rounded-2xl p-8 flex flex-col gap-6 text-center glass-card-hover-slate">
                <div class="flex justify-between items-center text-sm font-mono text-slate-400 mb-4 border-b border-slate-700/50 pb-4">
                    <span>Modus: <span id="mode-display" class="text-white font-bold">Artikel -> Inhalt</span></span>
                    <span>Fortschritt: <span id="score-display" class="text-white">0 / 0</span></span>
                </div>

                <div class="min-h-[120px] flex flex-col justify-center items-center">
                    <h2 id="word-display" class="text-3xl font-bold text-white mb-2 tracking-tight">Laden...</h2>
                    <div id="answer-display" class="text-2xl font-medium text-slate-300 mt-4 hidden"></div>
                </div>

                <div class="flex flex-col gap-4">
                    <button id="flip-btn" onclick="flipCard()" class="w-full py-3 px-4 bg-slate-700 hover:bg-slate-600 text-white font-medium rounded-xl transition-colors shadow-lg">
                        Karte umdrehen
                    </button>

                    <div id="eval-btns" class="hidden flex gap-4">
                        <button onclick="checkAnswer(false)" class="flex-1 py-3 px-4 bg-red-600/80 hover:bg-red-500 text-white font-medium rounded-xl transition-colors shadow-lg shadow-red-600/20">
                            Nicht gewusst
                        </button>
                        <button onclick="checkAnswer(true)" class="flex-1 py-3 px-4 bg-emerald-600/80 hover:bg-emerald-500 text-white font-medium rounded-xl transition-colors shadow-lg shadow-emerald-600/20">
                            Gewusst
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Footer -->
    <footer class="w-full text-center py-6 border-t border-slate-900 text-xs text-slate-600 font-mono relative z-10 bg-black/20 backdrop-blur-sm mt-auto">
        &copy; 2026 kplueschke All rights reserved.
    </footer>

    <script>
        const vocabulary = [{"artikel": "Artikel 1", "inhalt": "Schutz der Menschenwürde"}, {"artikel": "Artikel 2", "inhalt": "Freie Entfaltung der Persönlichkeit, Recht auf Leben"}, {"artikel": "Artikel 3", "inhalt": "Gleichheit vor dem Gesetz, Gleichberechtigung"}, {"artikel": "Artikel 4", "inhalt": "Glaubens- und Gewissensfreiheit"}, {"artikel": "Artikel 5", "inhalt": "Meinungs-, Presse-, Kunst- und Wissenschaftsfreiheit"}, {"artikel": "Artikel 6", "inhalt": "Schutz von Ehe und Familie"}, {"artikel": "Artikel 7", "inhalt": "Schulwesen"}, {"artikel": "Artikel 8", "inhalt": "Versammlungsfreiheit"}, {"artikel": "Artikel 9", "inhalt": "Vereinigungs- und Koalitionsfreiheit"}, {"artikel": "Artikel 10", "inhalt": "Brief-, Post- und Fernmeldegeheimnis"}, {"artikel": "Artikel 11", "inhalt": "Freizügigkeit"}, {"artikel": "Artikel 12", "inhalt": "Berufsfreiheit"}, {"artikel": "Artikel 12a", "inhalt": "Wehr- und Ersatzdienst"}, {"artikel": "Artikel 13", "inhalt": "Unverletzlichkeit der Wohnung"}, {"artikel": "Artikel 14", "inhalt": "Eigentum, Erbrecht, Enteignung"}, {"artikel": "Artikel 15", "inhalt": "Sozialisierung"}, {"artikel": "Artikel 16", "inhalt": "Staatsangehörigkeit, Auslieferung"}, {"artikel": "Artikel 16a", "inhalt": "Asylrecht"}, {"artikel": "Artikel 17", "inhalt": "Petitionsrecht"}, {"artikel": "Artikel 18", "inhalt": "Verwirkung von Grundrechten"}, {"artikel": "Artikel 19", "inhalt": "Einschränkung von Grundrechten, Rechtsweg"}, {"artikel": "Artikel 20", "inhalt": "Staatsstrukturprinzipien, Widerstandsrecht"}];

        let currentWordIndex = -1;
        let mode = 'art-inhalt'; // 'art-inhalt' or 'inhalt-art'
        let attempts = 0;
        let correctAnswers = 0;
        let wordsQueue = [];

        const wordDisplay = document.getElementById('word-display');
        const answerDisplay = document.getElementById('answer-display');
        const flipBtn = document.getElementById('flip-btn');
        const evalBtns = document.getElementById('eval-btns');
        const scoreDisplay = document.getElementById('score-display');
        const modeDisplay = document.getElementById('mode-display');

        function initQueue() {
            wordsQueue = [...Array(vocabulary.length).keys()];
            shuffleArray(wordsQueue);
        }

        function shuffleArray(array) {
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];
            }
        }

        function nextWord() {
            if (wordsQueue.length === 0) {
                initQueue();
            }

            // Randomly switch mode
            mode = Math.random() > 0.5 ? 'art-inhalt' : 'inhalt-art';
            modeDisplay.textContent = mode === 'art-inhalt' ? 'Artikel -> Inhalt' : 'Inhalt -> Artikel';

            currentWordIndex = wordsQueue.pop();
            const wordObj = vocabulary[currentWordIndex];

            wordDisplay.textContent = mode === 'art-inhalt' ? wordObj.artikel : wordObj.inhalt;

            answerDisplay.textContent = '';
            answerDisplay.classList.add('hidden');
            evalBtns.classList.add('hidden');
            flipBtn.classList.remove('hidden');
        }

        function flipCard() {
            const wordObj = vocabulary[currentWordIndex];
            const correctAnswer = mode === 'art-inhalt' ? wordObj.inhalt : wordObj.artikel;

            answerDisplay.textContent = correctAnswer;
            answerDisplay.classList.remove('hidden');

            flipBtn.classList.add('hidden');
            evalBtns.classList.remove('hidden');
        }

        function checkAnswer(isCorrect) {
            attempts++;

            if (isCorrect) {
                correctAnswers++;
            }

            scoreDisplay.textContent = `${correctAnswers} / ${attempts}`;

            nextWord();
        }

        // Initialize
        initQueue();
        nextWord();
    </script>
    <script src="matrix.js"></script>
</body>
</html>

        let mode = 'en-de'; // 'en-de' or 'de-en'
        let attempts = 0;
        let correctAnswers = 0;
        let wordsQueue = [];

        const wordDisplay = document.getElementById('word-display');
        const answerDisplay = document.getElementById('answer-display');
        const flipBtn = document.getElementById('flip-btn');
        const evalBtns = document.getElementById('eval-btns');
        const scoreDisplay = document.getElementById('score-display');
        const modeDisplay = document.getElementById('mode-display');

        function initQueue() {
            wordsQueue = [...Array(vocabulary.length).keys()];
            shuffleArray(wordsQueue);
        }

        function shuffleArray(array) {
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];
            }
        }

        function nextWord() {
            if (wordsQueue.length === 0) {
                initQueue();
            }

            // Randomly switch mode
            mode = Math.random() > 0.5 ? 'en-de' : 'de-en';
            modeDisplay.textContent = mode === 'en-de' ? 'Englisch -> Deutsch' : 'Deutsch -> Englisch';

            currentWordIndex = wordsQueue.pop();
            const wordObj = vocabulary[currentWordIndex];

            wordDisplay.textContent = mode === 'en-de' ? wordObj.english : wordObj.german;

            answerDisplay.textContent = '';
            answerDisplay.classList.add('hidden');
            evalBtns.classList.add('hidden');
            flipBtn.classList.remove('hidden');
        }

        function flipCard() {
            const wordObj = vocabulary[currentWordIndex];
            const correctAnswer = mode === 'en-de' ? wordObj.german : wordObj.english;

            answerDisplay.textContent = correctAnswer;
            answerDisplay.classList.remove('hidden');

            flipBtn.classList.add('hidden');
            evalBtns.classList.remove('hidden');
        }

        function checkAnswer(isCorrect) {
            attempts++;

            if (isCorrect) {
                correctAnswers++;
            }

            scoreDisplay.textContent = `${correctAnswers} / ${attempts}`;

            nextWord();
        }

        // Initialize
        initQueue();
        nextWord();

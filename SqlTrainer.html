<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>SQL Query Trainer</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Fira+Code:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body class="text-slate-200 min-h-screen flex flex-col justify-between bg-[#0a0a0a]">

    <!-- Background Decorative Elements -->
    <canvas id="matrix-bg" class="fixed inset-0 z-0"></canvas>
    <div class="absolute top-0 left-1/2 -translate-x-1/2 w-full max-w-7xl h-96 bg-gradient-to-b from-red-500/10 via-transparent to-transparent blur-3xl pointer-events-none"></div>

   <!-- Header -->

        <!-- Left Header Controls -->
    <div class="absolute top-4 left-4 flex gap-4 z-50">
        <a href="ap.html" class="inline-flex items-center justify-center w-10 h-10 rounded-full bg-slate-800/50 border border-slate-700/50 text-slate-400 hover:text-white hover:bg-slate-700/50 transition-colors cursor-pointer" title="Zurück">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" d="M10 19l-7-7m0 0l7-7m-7 7h18" />
            </svg>
        </a>
    </div>

    <!-- Header Controls -->
    <div class="absolute top-4 right-4 flex gap-4 z-50">
        <button id="matrix-pause-btn" class="inline-flex items-center justify-center w-10 h-10 rounded-full bg-slate-800/50 border border-slate-700/50 text-slate-400 hover:text-white hover:bg-slate-700/50 transition-colors cursor-pointer" title="Matrix-Regen pausieren/fortsetzen">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" d="M15.75 5.25v13.5m-7.5-13.5v13.5" />
            </svg>
        </button>
        <a href="einstellungen.html" class="inline-flex items-center justify-center w-10 h-10 rounded-full bg-slate-800/50 border border-slate-700/50 text-slate-400 hover:text-white hover:bg-slate-700/50 transition-colors cursor-pointer" title="Einstellungen">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" d="M9.594 3.94c.09-.542.56-.94 1.11-.94h2.593c.55 0 1.02.398 1.11.94l.213 1.281c.063.374.313.686.645.87.074.04.147.083.22.127.325.196.72.257 1.075.124l1.217-.456a1.125 1.125 0 0 1 1.37.49l1.296 2.247a1.125 1.125 0 0 1-.26 1.431l-1.003.827c-.293.241-.438.613-.43.992a7.723 7.723 0 0 1 0 .255c-.008.378.137.75.43.99l1.005.828c.424.35.534.955.26 1.43l-1.298 2.247a1.125 1.125 0 0 1-1.369.491l-1.217-.456c-.355-.133-.75-.072-1.076.124a6.47 6.47 0 0 1-.22.128c-.331.183-.581.495-.644.869l-.213 1.281c-.09.543-.56.94-1.11.94h-2.594c-.55 0-1.019-.398-1.11-.94l-.213-1.281c-.062-.374-.312-.686-.644-.87a6.52 6.52 0 0 1-.22-.127c-.325-.196-.72-.257-1.076-.124l-1.217.456a1.125 1.125 0 0 1-1.369-.49l-1.297-2.247a1.125 1.125 0 0 1 .26-1.431l1.004-.827c.292-.24.437-.613.43-.991a6.932 6.932 0 0 1 0-.255c.007-.38-.138-.751-.43-.992l-1.004-.827a1.125 1.125 0 0 1-.26-1.43l1.297-2.247a1.125 1.125 0 0 1 1.37-.491l1.216.456c.356.133.751.072 1.076-.124.072-.044.146-.086.22-.128.332-.183.582-.495.644-.869l.214-1.28Z" />
                <path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 1 1-6 0 3 3 0 0 1 6 0Z" />
            </svg>
        </a>
    </div>

    <div class="container mx-auto px-4 py-8 relative z-10 flex-grow flex flex-col">

        <div class="text-center mb-12">
            <h1 class="text-3xl md:text-4xl font-extrabold tracking-tight bg-clip-text text-transparent bg-gradient-to-r from-red-400 to-red-600 mb-4 font-mono">
                SQL Query Trainer
            </h1>
            <p class="text-slate-400 max-w-2xl mx-auto">
                Schreibe die passenden SQL-Statements für die folgenden Aufgaben.
            </p>
        </div>




        <div class="max-w-4xl mx-auto w-full relative z-10 flex-grow">
            <div class="flex justify-end mb-6">
                <button onclick="generateTask()" class="px-4 py-2 bg-slate-800 hover:bg-slate-700 text-slate-300 text-sm font-medium rounded-lg border border-slate-700 transition-colors flex items-center gap-2">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path>
                    </svg>
                    Neue Aufgabe generieren
                </button>
            </div>

            <div class="grid md:grid-cols-2 gap-6 items-start">

                <!-- Schema Panel -->
                <div class="glass-card rounded-2xl p-6 flex flex-col gap-4">
                    <div class="flex items-center gap-2 text-red-400 mb-2 border-b border-slate-700/50 pb-2">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 7v10c0 2.21 3.582 4 8 4s8-1.79 8-4V7M4 7c0 2.21 3.582 4 8 4s8-1.79 8-4M4 7c0-2.21 3.582-4 8-4s8 1.79 8 4m0 5c0 2.21-3.582 4-8 4s-8-1.79-8-4"></path></svg>
                        <h2 class="font-mono font-semibold">Datenbankschema</h2>
                    </div>
                    <div id="schema-display" class="font-mono text-sm text-slate-300 space-y-3">
                        Laden...
                    </div>
                </div>

                <!-- Task & Input Panel -->
                <div class="glass-card rounded-2xl p-6 flex flex-col gap-6">
                    <div class="flex justify-between items-center text-sm font-mono text-slate-400 border-b border-slate-700/50 pb-2">
                        <span>Aufgabe</span>
                        <span>Korrekte Antworten: <span id="score-display" class="text-white">0</span> / Versuche: <span id="attempts-display" class="text-white">0</span></span>
                    </div>

                    <div class="mb-2">
                        <p id="task-description" class="text-slate-200 text-lg">Laden...</p>
                    </div>

                    <div class="flex flex-col gap-3">
                        <div class="relative">
                            <div class="absolute top-0 right-0 px-2 py-1 bg-slate-800 rounded-bl-lg border-b border-l border-slate-700 text-xs text-slate-500 font-mono">query.sql</div>
                            <textarea id="sql-input" class="w-full h-32 bg-slate-900/80 border border-slate-700 rounded-xl p-4 pt-6 text-white focus:outline-none focus:border-red-500 focus:ring-1 focus:ring-red-500 transition-all font-mono resize-y" placeholder="SELECT * FROM..."></textarea>
                        </div>

                        <button id="check-btn" onclick="showSolution()" class="w-full py-3 px-4 bg-red-600 hover:bg-red-500 text-white font-medium rounded-xl transition-colors shadow-lg shadow-red-600/20">
                            Lösung anzeigen
                        </button>

                        <button id="next-btn" onclick="nextTask()" class="hidden w-full py-3 px-4 bg-slate-700 hover:bg-slate-600 text-white font-medium rounded-xl transition-colors">
                            Nächste Aufgabe
                        </button>

                        <div id="eval-btns" class="hidden flex gap-4">
                            <button onclick="assessAnswer(false)" class="flex-1 py-3 px-4 bg-red-600/80 hover:bg-red-500 text-white font-medium rounded-xl transition-colors shadow-lg shadow-red-600/20">
                                Nicht gewusst
                            </button>
                            <button onclick="assessAnswer(true)" class="flex-1 py-3 px-4 bg-emerald-600/80 hover:bg-emerald-500 text-white font-medium rounded-xl transition-colors shadow-lg shadow-emerald-600/20">
                                Gewusst
                            </button>
                        </div>
                    </div>

                    <div id="feedback" class="mt-2 p-4 rounded-xl hidden font-medium transition-all text-sm border flex flex-col gap-2"></div>
                </div>

            </div>
        </div>
    </div>

    <!-- Footer -->
    <footer class="w-full text-center py-6 border-t border-slate-900 text-xs text-slate-600 font-mono relative z-10 bg-black/20 backdrop-blur-sm mt-auto">
        &copy; 2026 kplueschke All rights reserved.
    </footer>

    <script src="matrix.js"></script>
    <script>
        const schemas = {
            mitarbeiterDB: {
                name: "MitarbeiterDB",
                tables: [
                    {
                        name: "mitarbeiter",
                        columns: ["id (INT, PK)", "vorname (VARCHAR)", "nachname (VARCHAR)", "abteilung_id (INT, FK)", "gehalt (DECIMAL)"]
                    },
                    {
                        name: "abteilungen",
                        columns: ["id (INT, PK)", "name (VARCHAR)", "standort (VARCHAR)"]
                    }
                ]
            },
            shopDB: {
                name: "ShopDB",
                tables: [
                    {
                        name: "kunden",
                        columns: ["kunden_id (INT, PK)", "name (VARCHAR)", "stadt (VARCHAR)"]
                    },
                    {
                        name: "bestellungen",
                        columns: ["bestell_id (INT, PK)", "kunden_id (INT, FK)", "datum (DATE)", "betrag (DECIMAL)"]
                    }
                ]
            }
        };

        let currentTask = null;
        let attempts = 0;
        let correctAnswers = 0;

        const schemaDisplay = document.getElementById('schema-display');
        const taskDescription = document.getElementById('task-description');
        const sqlInput = document.getElementById('sql-input');
        const checkBtn = document.getElementById('check-btn');
        const nextBtn = document.getElementById('next-btn');
        const feedbackEl = document.getElementById('feedback');
        const scoreDisplay = document.getElementById('score-display');
        const attemptsDisplay = document.getElementById('attempts-display');

        function generateTask() {
            const schemaKeys = Object.keys(schemas);
            const randomSchemaKey = schemaKeys[Math.floor(Math.random() * schemaKeys.length)];
            const schema = schemas[randomSchemaKey];

            const operations = ["SELECT", "INSERT", "UPDATE", "DELETE", "JOIN"];
            const randomOp = operations[Math.floor(Math.random() * operations.length)];

            let description = "";
            let solution = "";
            let explanation = "";

            if (randomSchemaKey === "mitarbeiterDB") {
                if (randomOp === "SELECT") {
                    description = "Wähle den Vor- und Nachnamen aller Mitarbeiter aus.";
                    solution = "SELECT vorname, nachname FROM mitarbeiter;";
                    explanation = "Verwende SELECT, um die Spalten 'vorname' und 'nachname' auszuwählen. Mit FROM gibst du die Tabelle 'mitarbeiter' an.";
                } else if (randomOp === "INSERT") {
                    const rndSal = Math.floor(Math.random() * 2000) + 3000;
                    description = `Füge einen neuen Mitarbeiter namens 'Max Mustermann' mit der abteilung_id 1 und einem Gehalt von ${rndSal} hinzu.`;
                    solution = `INSERT INTO mitarbeiter (vorname, nachname, abteilung_id, gehalt) VALUES ('Max', 'Mustermann', 1, ${rndSal});`;
                    explanation = "Verwende INSERT INTO gefolgt vom Tabellennamen und den Spaltennamen in Klammern. VALUES gefolgt von den einzufügenden Werten in der gleichen Reihenfolge.";
                } else if (randomOp === "UPDATE") {
                    const rndAbt = Math.floor(Math.random() * 5) + 1;
                    const rndSal = Math.floor(Math.random() * 1000) + 4000;
                    description = `Erhöhe das Gehalt aller Mitarbeiter in der Abteilung mit der ID ${rndAbt} auf ${rndSal}.`;
                    solution = `UPDATE mitarbeiter SET gehalt = ${rndSal} WHERE abteilung_id = ${rndAbt};`;
                    explanation = "UPDATE ändert Datensätze. SET gibt an, welche Spalte(n) welchen neuen Wert bekommen. Die WHERE-Klausel schränkt ein, welche Datensätze betroffen sind.";
                } else if (randomOp === "DELETE") {
                    const rndAbt = Math.floor(Math.random() * 5) + 1;
                    description = `Lösche alle Mitarbeiter, die in der Abteilung mit der ID ${rndAbt} arbeiten.`;
                    solution = `DELETE FROM mitarbeiter WHERE abteilung_id = ${rndAbt};`;
                    explanation = "DELETE FROM löscht Zeilen aus einer Tabelle. Mit WHERE definierst du die Bedingung, damit nicht alle Mitarbeiter gelöscht werden.";
                } else if (randomOp === "JOIN") {
                    description = "Ermittle den Vor- und Nachnamen des Mitarbeiters sowie den Namen seiner Abteilung.";
                    solution = "SELECT mitarbeiter.vorname, mitarbeiter.nachname, abteilungen.name FROM mitarbeiter JOIN abteilungen ON mitarbeiter.abteilung_id = abteilungen.id;";
                    explanation = "Verwende JOIN, um die Tabellen 'mitarbeiter' und 'abteilungen' über die Fremdschlüssel-Beziehung (abteilung_id = id) zu verbinden.";
                }
            } else if (randomSchemaKey === "shopDB") {
                if (randomOp === "SELECT") {
                    description = "Wähle den Namen und die Stadt aller Kunden aus.";
                    solution = "SELECT name, stadt FROM kunden;";
                    explanation = "Verwende SELECT, um die gewünschten Spalten aus der Tabelle 'kunden' auszuwählen.";
                } else if (randomOp === "INSERT") {
                    const cities = ['Berlin', 'München', 'Hamburg', 'Köln'];
                    const rndCity = cities[Math.floor(Math.random() * cities.length)];
                    description = `Füge einen neuen Kunden namens 'Erika Musterfrau' aus der Stadt '${rndCity}' hinzu.`;
                    solution = `INSERT INTO kunden (name, stadt) VALUES ('Erika Musterfrau', '${rndCity}');`;
                    explanation = "Verwende INSERT INTO gefolgt vom Tabellennamen und den Spaltennamen in Klammern. VALUES gefolgt von den einzufügenden Werten.";
                } else if (randomOp === "UPDATE") {
                    const rndAmount = (Math.random() * 100 + 50).toFixed(2);
                    description = `Ändere den Betrag der Bestellung mit der ID 1 auf ${rndAmount}.`;
                    solution = `UPDATE bestellungen SET betrag = ${rndAmount} WHERE bestell_id = 1;`;
                    explanation = "UPDATE ändert den Datensatz der Tabelle 'bestellungen'. SET aktualisiert den 'betrag' für die spezifische 'bestell_id'.";
                } else if (randomOp === "DELETE") {
                    const cities = ['Berlin', 'München', 'Hamburg', 'Köln'];
                    const rndCity = cities[Math.floor(Math.random() * cities.length)];
                    description = `Lösche alle Kunden, die in der Stadt '${rndCity}' wohnen.`;
                    solution = `DELETE FROM kunden WHERE stadt = '${rndCity}';`;
                    explanation = "DELETE FROM löscht Zeilen. Mit WHERE schränkst du das Löschen auf Kunden der angegebenen Stadt ein.";
                } else if (randomOp === "JOIN") {
                    description = "Ermittle den Namen des Kunden und das Datum seiner Bestellungen.";
                    solution = "SELECT kunden.name, bestellungen.datum FROM kunden JOIN bestellungen ON kunden.kunden_id = bestellungen.kunden_id;";
                    explanation = "Nutze JOIN, um die Tabellen 'kunden' und 'bestellungen' über das gemeinsame Feld 'kunden_id' zu verknüpfen.";
                }
            }

            currentTask = {
                schema: randomSchemaKey,
                description: description,
                solution: solution,
                explanation: explanation
            };

            renderSchema(currentTask.schema);
            taskDescription.textContent = currentTask.description;
            sqlInput.value = '';
            sqlInput.disabled = false;
            sqlInput.focus();

            checkBtn.classList.remove('hidden');
            nextBtn.classList.add('hidden');
            document.getElementById('eval-btns').classList.add('hidden');
            feedbackEl.classList.add('hidden');
            feedbackEl.className = 'mt-2 p-4 rounded-xl hidden font-medium transition-all text-sm border flex flex-col gap-2';
        }

        function renderSchema(schemaKey) {
            const schema = schemas[schemaKey];
            let html = `<div class="mb-2 text-slate-400">Aktuelles Schema: <span class="text-slate-200">${schema.name}</span></div>`;

            schema.tables.forEach(table => {
                html += `
                <div class="bg-slate-900/50 rounded-lg p-3 border border-slate-700/50">
                    <div class="text-red-400 font-bold mb-1">${table.name}</div>
                    <ul class="list-disc list-inside text-xs text-slate-400 pl-2">
                        ${table.columns.map(col => `<li>${col}</li>`).join('')}
                    </ul>
                </div>`;
            });

            schemaDisplay.innerHTML = html;
        }

        function showSolution() {
            const task = currentTask;

            // Lock input and hide check button
            sqlInput.disabled = true;
            checkBtn.classList.add('hidden');

            // Show solution in feedback element
            feedbackEl.innerHTML = `
                <div class="text-slate-300 mt-1">Lösungsvorschlag:</div>
                <code class="bg-slate-900 p-2 rounded text-emerald-400 block break-all whitespace-pre-wrap">${task.solution}</code>
                <div class="text-slate-400 mt-1"><strong class="text-slate-300">Erklärung:</strong> ${task.explanation}</div>
            `;

            // Just neutral background for solution display
            feedbackEl.classList.add('bg-slate-800/50', 'border-slate-700/50');
            feedbackEl.classList.remove('hidden');

            // Show self-assessment buttons
            document.getElementById('eval-btns').classList.remove('hidden');
        }

        function assessAnswer(isCorrect) {
            attempts++;

            document.getElementById('eval-btns').classList.add('hidden');

            // Remove neutral background
            feedbackEl.classList.remove('bg-slate-800/50', 'border-slate-700/50');

            if (isCorrect) {
                correctAnswers++;
                feedbackEl.classList.add('bg-emerald-500/20', 'border-emerald-500/30');

                // Add positive feedback title at top of feedback element
                const successTitle = document.createElement('div');
                successTitle.className = "text-emerald-400 font-bold text-base mb-2";
                successTitle.textContent = "Korrekt beantwortet!";
                feedbackEl.prepend(successTitle);

                sqlInput.classList.remove('border-slate-700');
                sqlInput.classList.add('border-emerald-500');
            } else {
                feedbackEl.classList.add('bg-red-500/20', 'border-red-500/30');

                // Add negative feedback title at top of feedback element
                const failTitle = document.createElement('div');
                failTitle.className = "text-red-400 font-bold text-base mb-2";
                failTitle.textContent = "Falsch beantwortet";
                feedbackEl.prepend(failTitle);

                sqlInput.classList.remove('border-slate-700');
                sqlInput.classList.add('border-red-500');
            }

            scoreDisplay.textContent = correctAnswers;
            attemptsDisplay.textContent = attempts;
            nextBtn.classList.remove('hidden');
            nextBtn.focus();
        }

        function nextTask() {
            sqlInput.classList.remove('border-emerald-500', 'border-red-500');
            sqlInput.classList.add('border-slate-700');
            generateTask();
        }

        // Allow executing via Ctrl+Enter
        sqlInput.addEventListener('keydown', function(e) {
            if (e.ctrlKey && e.key === 'Enter') {
                // Only allow this if we haven't already shown the solution
                if (!checkBtn.classList.contains('hidden')) {
                    showSolution();
                }
            }
        });

        // Initialize
        generateTask();
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>OSI & TCP/IP Modell Drag & Drop Puzzle</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Fira+Code:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body class="text-slate-200 min-h-screen flex flex-col justify-between">

    <!-- Background Decorative Elements -->
    <canvas id="matrix-bg" class="fixed inset-0 z-0 pointer-events-none"></canvas>

   <!-- Header -->

    <!-- Header Controls -->
    <div class="absolute top-4 right-4 flex gap-4 z-50">
        <button id="matrix-pause-btn" class="inline-flex items-center justify-center w-10 h-10 rounded-full bg-slate-800/50 border border-slate-700/50 text-slate-400 hover:text-white hover:bg-slate-700/50 transition-colors cursor-pointer" title="Matrix-Regen pausieren/fortsetzen">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" d="M15.75 5.25v13.5m-7.5-13.5v13.5" />
            </svg>
        </button>
        <a href="einstellungen.html" class="inline-flex items-center justify-center w-10 h-10 rounded-full bg-slate-800/50 border border-slate-700/50 text-slate-400 hover:text-white hover:bg-slate-700/50 transition-colors cursor-pointer" title="Einstellungen">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" d="M9.594 3.94c.09-.542.56-.94 1.11-.94h2.593c.55 0 1.02.398 1.11.94l.213 1.281c.063.374.313.686.645.87.074.04.147.083.22.127.325.196.72.257 1.075.124l1.217-.456a1.125 1.125 0 0 1 1.37.49l1.296 2.247a1.125 1.125 0 0 1-.26 1.431l-1.003.827c-.293.241-.438.613-.43.992a7.723 7.723 0 0 1 0 .255c-.008.378.137.75.43.99l1.005.828c.424.35.534.955.26 1.43l-1.298 2.247a1.125 1.125 0 0 1-1.369.491l-1.217-.456c-.355-.133-.75-.072-1.076.124a6.47 6.47 0 0 1-.22.128c-.331.183-.581.495-.644.869l-.213 1.281c-.09.543-.56.94-1.11.94h-2.594c-.55 0-1.019-.398-1.11-.94l-.213-1.281c-.062-.374-.312-.686-.644-.87a6.52 6.52 0 0 1-.22-.127c-.325-.196-.72-.257-1.076-.124l-1.217.456a1.125 1.125 0 0 1-1.369-.49l-1.297-2.247a1.125 1.125 0 0 1 .26-1.431l1.004-.827c.292-.24.437-.613.43-.991a6.932 6.932 0 0 1 0-.255c.007-.38-.138-.751-.43-.992l-1.004-.827a1.125 1.125 0 0 1-.26-1.43l1.297-2.247a1.125 1.125 0 0 1 1.37-.491l1.216.456c.356.133.751.072 1.076-.124.072-.044.146-.086.22-.128.332-.183.582-.495.644-.869l.214-1.28Z" />
                <path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 1 1-6 0 3 3 0 0 1 6 0Z" />
            </svg>
        </a>
    </div>

    <div class="container mx-auto px-4 py-8 relative z-10">
        <div class="flex items-center justify-between mb-8">
            <button onclick="window.location.href='its.html'" class="inline-flex items-center gap-2 text-slate-400 hover:text-white transition-colors">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M10 19l-7-7m0 0l7-7m-7 7h18"></path>
                </svg>
                Zurück zur Übersicht
            </button>
        </div>
        <div class="text-center mb-12">
            <h1 class="text-3xl md:text-4xl font-extrabold tracking-tight bg-clip-text text-transparent bg-gradient-to-r from-orange-400 to-red-500 mb-4">
                OSI & TCP/IP Modell Puzzle
            </h1>
            <p class="text-slate-400 max-w-2xl mx-auto">
                Ziehe die Protokolle, Geräte und PDUs auf die entsprechenden Schichten des OSI-Modells.
            </p>
        </div>

        <div class="flex flex-col lg:flex-row gap-8 max-w-6xl mx-auto items-start relative z-10">

            <!-- OSI Layers (Drop Zones) -->
            <div class="w-full lg:w-2/3 glass-card rounded-2xl p-6 flex flex-col gap-3" id="osi-layers-container">
                <h2 class="text-xl font-bold text-white mb-2 text-center">OSI Modell</h2>
                <!-- Layers will be generated here by JS -->
            </div>

            <!-- Item Pool (Draggables) -->
            <div class="w-full lg:w-1/3 glass-card rounded-2xl p-6 sticky top-8">
                <h2 class="text-xl font-bold text-white mb-4 text-center">Begriffe</h2>
                <div class="flex flex-wrap gap-2 justify-center min-h-[300px] content-start" id="item-pool">
                    <!-- Items will be generated here by JS -->
                </div>

                <div class="mt-8 flex gap-4">
                    <button id="btn-check" class="flex-1 py-3 px-4 bg-orange-600 hover:bg-orange-500 text-white font-medium rounded-xl transition-colors shadow-lg shadow-orange-600/20">
                        Prüfen
                    </button>
                    <button id="btn-reset" class="py-3 px-4 bg-slate-700 hover:bg-slate-600 text-white font-medium rounded-xl transition-colors">
                        Reset
                    </button>
                </div>
            </div>

        </div>
    </div>

    <!-- Footer -->
    <footer class="w-full text-center py-6 border-t border-slate-900 text-xs text-slate-600 mono relative z-10 bg-black/20 backdrop-blur-sm mt-8">
        &copy; 2026 kplueschke All rights reserved.
    </footer>

    <script>
        // OSI Layers Data
        const osiLayers = [
            { id: 7, name: "7. Application Layer", color: "border-pink-500/50 bg-pink-500/10" },
            { id: 6, name: "6. Presentation Layer", color: "border-purple-500/50 bg-purple-500/10" },
            { id: 5, name: "5. Session Layer", color: "border-indigo-500/50 bg-indigo-500/10" },
            { id: 4, name: "4. Transport Layer", color: "border-blue-500/50 bg-blue-500/10" },
            { id: 3, name: "3. Network Layer", color: "border-cyan-500/50 bg-cyan-500/10" },
            { id: 2, name: "2. Data Link Layer", color: "border-emerald-500/50 bg-emerald-500/10" },
            { id: 1, name: "1. Physical Layer", color: "border-green-500/50 bg-green-500/10" }
        ];

        // Draggable Items Data
        const draggablesData = [
            { id: "item-http", text: "HTTP", layer: 7 },
            { id: "item-ftp", text: "FTP", layer: 7 },
            { id: "item-jpeg", text: "JPEG / ASCII", layer: 6 },
            { id: "item-tcp", text: "TCP", layer: 4 },
            { id: "item-udp", text: "UDP", layer: 4 },
            { id: "item-segment", text: "Segment (PDU)", layer: 4 },
            { id: "item-ip", text: "IP (IPv4/IPv6)", layer: 3 },
            { id: "item-router", text: "Router", layer: 3 },
            { id: "item-packet", text: "Packet (PDU)", layer: 3 },
            { id: "item-mac", text: "MAC-Adresse", layer: 2 },
            { id: "item-switch", text: "Switch", layer: 2 },
            { id: "item-frame", text: "Frame (PDU)", layer: 2 },
            { id: "item-hub", text: "Hub / Kabel", layer: 1 },
            { id: "item-bits", text: "Bits (PDU)", layer: 1 }
        ];

        const container = document.getElementById('osi-layers-container');
        const pool = document.getElementById('item-pool');
        const checkBtn = document.getElementById('btn-check');
        const resetBtn = document.getElementById('btn-reset');

        let draggedItem = null;

        // Initialize UI
        function init() {
            // Render Layers
            container.innerHTML = '<h2 class="text-xl font-bold text-white mb-2 text-center">OSI Modell</h2>';
            osiLayers.forEach(layer => {
                const layerDiv = document.createElement('div');
                layerDiv.className = `drop-zone flex items-center min-h-[60px] border-2 rounded-xl p-2 ${layer.color}`;
                layerDiv.dataset.layerId = layer.id;

                const label = document.createElement('div');
                label.className = 'w-1/3 text-sm font-semibold text-slate-300';
                label.textContent = layer.name;

                const dropArea = document.createElement('div');
                dropArea.className = 'w-2/3 flex flex-wrap gap-2 items-center min-h-[40px] px-2';
                dropArea.dataset.dropArea = layer.id;

                layerDiv.appendChild(label);
                layerDiv.appendChild(dropArea);
                container.appendChild(layerDiv);

                // Add drop zone event listeners
                layerDiv.addEventListener('dragover', handleDragOver);
                layerDiv.addEventListener('dragenter', handleDragEnter);
                layerDiv.addEventListener('dragleave', handleDragLeave);
                layerDiv.addEventListener('drop', handleDrop);
            });

            // Add drop listener to pool
            pool.addEventListener('dragover', handleDragOver);
            pool.addEventListener('drop', handleDropToPool);

            // Render Items
            renderItems();
        }

        function renderItems() {
            pool.innerHTML = '';
            // Shuffle draggables for randomness
            const shuffled = [...draggablesData].sort(() => 0.5 - Math.random());

            shuffled.forEach(item => {
                const el = document.createElement('div');
                el.className = 'draggable-item bg-slate-800 border border-slate-600 rounded-lg px-3 py-1.5 text-sm font-medium text-slate-200 shadow-sm hover:bg-slate-700 select-none';
                el.draggable = true;
                el.id = item.id;
                el.textContent = item.text;
                el.dataset.correctLayer = item.layer;

                el.addEventListener('dragstart', handleDragStart);
                el.addEventListener('dragend', handleDragEnd);

                pool.appendChild(el);
            });
        }

        // Drag and Drop Handlers
        function handleDragStart(e) {
            draggedItem = this;
            setTimeout(() => this.classList.add('opacity-50'), 0);
            e.dataTransfer.effectAllowed = 'move';
        }

        function handleDragEnd() {
            this.classList.remove('opacity-50');
            draggedItem = null;
            document.querySelectorAll('.drop-zone').forEach(zone => zone.classList.remove('drag-over'));
        }

        function handleDragOver(e) {
            e.preventDefault();
            e.dataTransfer.dropEffect = 'move';
            return false;
        }

        function handleDragEnter(e) {
            e.preventDefault();
            this.classList.add('drag-over');
        }

        function handleDragLeave() {
            this.classList.remove('drag-over');
        }

        function handleDrop(e) {
            e.stopPropagation();
            this.classList.remove('drag-over');

            // Append to the drop area inside the layer div
            const dropArea = this.querySelector('[data-drop-area]');
            if (draggedItem && dropArea) {
                // Reset styling just in case it was checked before
                draggedItem.classList.remove('bg-green-600/80', 'border-green-400', 'bg-red-600/80', 'border-red-400', 'bg-slate-800', 'border-slate-600');
                draggedItem.classList.add('bg-slate-800', 'border-slate-600');
                dropArea.appendChild(draggedItem);
            }
            return false;
        }

        function handleDropToPool(e) {
            e.stopPropagation();
            if (draggedItem) {
                // Reset styling
                draggedItem.classList.remove('bg-green-600/80', 'border-green-400', 'bg-red-600/80', 'border-red-400', 'bg-slate-800', 'border-slate-600');
                draggedItem.classList.add('bg-slate-800', 'border-slate-600');
                pool.appendChild(draggedItem);
            }
            return false;
        }

        // Check Logic
        checkBtn.addEventListener('click', () => {
            const allItems = document.querySelectorAll('.draggable-item');
            let allCorrect = true;

            allItems.forEach(item => {
                const parentArea = item.parentElement;

                // Remove previous check styles
                item.classList.remove('bg-green-600/80', 'border-green-400', 'bg-red-600/80', 'border-red-400', 'bg-slate-800', 'border-slate-600');

                if (parentArea.id === 'item-pool') {
                    item.classList.add('bg-slate-800', 'border-slate-600');
                    allCorrect = false;
                } else {
                    const currentLayer = parentArea.dataset.dropArea;
                    const correctLayer = item.dataset.correctLayer;

                    if (currentLayer === correctLayer) {
                        item.classList.add('bg-green-600/80', 'border-green-400');
                    } else {
                        item.classList.add('bg-red-600/80', 'border-red-400');
                        allCorrect = false;
                    }
                }
            });

            if (allCorrect && document.querySelectorAll('#item-pool .draggable-item').length === 0) {
                 checkBtn.textContent = "Perfekt gelöst! 🎉";
                 checkBtn.classList.replace('bg-orange-600', 'bg-green-600');
                 checkBtn.classList.replace('hover:bg-orange-500', 'hover:bg-green-500');
                 checkBtn.classList.replace('shadow-orange-600/20', 'shadow-green-600/20');
                 setTimeout(() => {
                     checkBtn.textContent = "Prüfen";
                     checkBtn.classList.replace('bg-green-600', 'bg-orange-600');
                     checkBtn.classList.replace('hover:bg-green-500', 'hover:bg-orange-500');
                     checkBtn.classList.replace('shadow-green-600/20', 'shadow-orange-600/20');
                 }, 3000);
            }
        });

        // Reset Logic
        resetBtn.addEventListener('click', () => {
            // Move all items back to pool and reset styles
            const allItems = document.querySelectorAll('.draggable-item');
            allItems.forEach(item => {
                item.classList.remove('bg-green-600/80', 'border-green-400', 'bg-red-600/80', 'border-red-400', 'bg-slate-800', 'border-slate-600');
                item.classList.add('bg-slate-800', 'border-slate-600');
                pool.appendChild(item);
            });
            // Shuffle them again
            renderItems();
        });

        // Initialize on load
        init();
    </script>
    <script src="matrix.js"></script>
</body>
</html>
